name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check plugins/fab0/bin/fab0-resolve tests scripts
      - run: uv run pytest -q
      - name: The resolver runs through its own uv shebang
        run: plugins/fab0/bin/fab0-resolve validate --project tests/fixtures/workspace/shop
