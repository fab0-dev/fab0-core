# Not a delivery factory: bug reports are triaged in the tracker, with no pull requests.
schema: 2
repos:
  home: {path: ., github: acme/support, owner: support}
people:
  support: {github: [support-user]}
tracker: {kind: github, owner: acme}
store: {path: ../runs}
models:
  claude-code: {deep: opus, balanced: sonnet, fast: haiku}
pipelines: [triage]
