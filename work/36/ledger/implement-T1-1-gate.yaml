  and never checks that a COMMENTED or CHANGES_REQUESTED review with no comments hashes
  exactly as before. That hash compatibility is the spec''s Compatibility constraint.;
  The test for S4 checks only that the unit isn''t sent back. It never checks the
  scenario''s second Then: that the brief says no reviews ask for changes when the
  pull request''s only comment is fab0''s own.; The ordering doesn''t follow the spec''s
