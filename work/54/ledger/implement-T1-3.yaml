summary: 'Rework done. Every ledger push is now logged again, and the event log is
  read with one validator per read. In `/Users/zhen/Work/Fab0/fab0-core/.git/fab0/worktrees/54/implement-T1`,
  `uv run pytest` passes (273 tests), and `uv run ruff check` and `uv run ruff format`
  are clean. I didn''t run `claude plugin validate`, because no plugin file changed.


  Changes:

  - **S4/S5, ledger pushes** (`plugins/fab0/lib/fab0_engine/events.py`): `EventLog.applied`
  now drops a repeat only for a unit''s entry that is identical to the last `apply`
  event of that unit. Ledger-branch pushes and item entries are always logged, one
  event per entry of `applied`. Because `subject()` is no longer used, I removed it.

  - **Cost of reading the log** (`events.py`, `plugins/fab0/lib/fab0_engine/schemas.py`):
  `read_events` builds one `Draft202012Validator` per read instead of one per line.
  To allow that, `schema_errors` takes an optional `validator` argument. Its other
  callers are unchanged.

  - **New test** (`tests/test_events.py`): `test_every_push_of_the_ledger_branch_is_logged`
  uses the `triage` fixture, which keeps a ledger branch. It makes two commits on
  `fab0/ledger`, runs `apply` after each, and expects two `apply: ledger: pushed fab0/ledger`
  events. It imports `remotes` from `test_conflicts`.


  Files changed: `plugins/fab0/lib/fab0_engine/events.py`, `plugins/fab0/lib/fab0_engine/schemas.py`,
  `tests/test_events.py`.'
