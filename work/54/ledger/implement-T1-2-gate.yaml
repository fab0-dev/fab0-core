  that block and the S7 and S9 gaps. The diff touches only T1's files. In the task
  worktree, `uv run pytest` passes (272 tests), and `uv run ruff check` and `uv run
  ruff format --check` are clean. S1, S2, S3, S5, S6, S7, S8 (as far as `log` exists
  yet) and S9 are implemented and tested.
verdict:
  decision: reject
  reasons:
  - S4 is not fully met. The duplicate filter in `EventLog.applied` covers the ledger
    branch and items as well as units. `publish_ledger` returns the same text, `pushed
    <ledger branch>`, on every push, so in a pipeline that keeps a ledger branch only
    the first push of the whole run gets an `apply` event and every later real push
    is dropped. S4 asks for one event per entry of `applied`. The spec allows only
    one exception, an entry identical to the last `apply` event of the same unit (S5),
    and a ledger push is a new action each time.
  - The previous gate's finding is fixed. `states()` now records `attempt` for a block
    with an auto gate, and new tests cover that block and the S7 and S9 gaps. The
    diff touches only T1's files. In the task worktree, `uv run pytest` passes (272
    tests), and `uv run ruff check` and `uv run ruff format --check` are clean. S1,
    S2, S3, S5, S6, S7, S8 (as far as `log` exists yet) and S9 are implemented and
    tested.
  findings:
  - check: Scenarios
    message: 'In `applied()`, `subject()` gives every ledger event the key ("other",
      "ledger") and the line is always `apply: ledger: pushed <branch>`, so every
      ledger push after the first is skipped as a repeat. Limit the S5 filter to unit
      entries, or never filter `ledger` entries, so that each push is logged.'
    location: plugins/fab0/lib/fab0_engine/events.py:160
  - check: Tests and checks
    message: 'No test covers a ledger-branch pipeline: nothing checks that two successive
      ledger pushes (for example two `apply` calls in the `triage` fixture as in `tests/test_inbox.py::test_apply_pushes_the_ledger_branch`,
      each after a new commit) add two `apply: ledger: pushed fab0/ledger` events.'
    location: tests/test_events.py:1
  - check: Quality that matters
    message: 'Minor: `read_events` builds a new `Draft202012Validator` for every line
      of the log, and `next` and `apply` read the whole log every time they write
      state events. That cost grows with the length of the log, which works against
      the constraint that writing an event adds no noticeable time; building one validator
      per read would fix it.'
    location: plugins/fab0/lib/fab0_engine/events.py:44
  details:
    unmet:
    - S4
