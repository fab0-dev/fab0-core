summary: S4 is not fully met. The duplicate filter in `EventLog.applied` covers the
  ledger branch and items as well as units. `publish_ledger` returns the same text,
  `pushed <ledger branch>`, on every push, so in a pipeline that keeps a ledger branch
  only the first push of the whole run gets an `apply` event and every later real
  push is dropped. S4 asks for one event per entry of `applied`. The spec allows only
  one exception, an entry identical to the last `apply` event of the same unit (S5),
  and a ledger push is a new action each time.; The previous gate's finding is fixed.
