summary: "Done. `fab0-resolve log <run> [--follow] [--project]` now prints a run's\
  \ event log as text, and `/fab0:run` shows how to follow the run. `uv run pytest`\
  \ passes (290 tests, 17 of them new in `tests/test_log.py`), and `uv run ruff check`\
  \ and `uv run ruff format` are clean. `claude plugin validate --strict plugins/fab0`\
  \ and `plugins/fab0/skills` both pass. I didn't run `scripts/e2e-triage.py` (it\
  \ costs tokens), although I changed the `/fab0:run` skill text.\n\nChanges, all\
  \ under `/Users/zhen/Work/Fab0/fab0-core/.git/fab0/worktrees/54/implement-T2`:\n\
  - `plugins/fab0/lib/fab0_engine/events.py`: `parse_lines`, `event_text` and `Tail`\
  \ are new. `read_events` is rebuilt on `parse_lines`, so one validator is still\
  \ built per read. `Tail.poll` returns only complete lines (up to the last newline),\
  \ so half an event is held back and then printed once. A line that isn't a valid\
  \ event prints as `event N can't be read`, N being its line number.\n- `plugins/fab0/lib/fab0_engine/cli.py`:\n\
  \  - `log` prints `<time>  <line>` per event, oldest first. It reads only the home\
  \ checkout's git common dir: no wiring, no tracker, no version check. It prints\
  \ `run N has no events here yet` when there is nothing to show.\n  - A bad run id\
  \ or a missing `.fab0/fab0.yaml` gives the usual `\"ok\": false` object and exit\
  \ 2.\n  - `--follow` polls once a second. Ctrl-C ends it with exit 0 and no traceback,\
  \ even if the parent started it with SIGINT ignored.\n  - `cmd_apply` adds `follow`\
  \ to apply's result: the shell-quoted `<engine bin/fab0-resolve, absolute> log <run>\
  \ --follow --project <home main checkout>`, with the engine path found from the\
  \ module's own location.\n- `plugins/fab0/skills/run/SKILL.md`: step 1 of the loop\
  \ shows `follow` verbatim in the first round only, before the `applied` list.\n\
  - `tests/conftest.py`: new `Factory.env`, `Factory.text` and `Factory.follow`, and\
  \ a `Follower` helper. The test stops the follower itself with SIGINT instead of\
  \ waiting on a timeout.\n- `README.md` and `CLAUDE.md`: they now describe `log`\
  \ and its text output, and the one-JSON-object rule is qualified to \"every command\
  \ but `log`\".\n\nTests in `tests/test_log.py` by scenario:\n- S8: read-only commands\
  \ (`status`, `inbox`, `validate`, `log`) leave the log unchanged and create none.\n\
  - S10, S11, S15: log output, the no-events line, and the unreadable-event line,\
  \ with and without `--follow`.\n- S12: follow prints existing events, then each\
  \ new one within 2.5 s; it also follows events written by real `apply` and `next`\
  \ runs.\n- S13: follow before the run starts waits and then prints.\n- S14: half\
  \ an event is not shown, then shown once.\n- S16: works with a failing `gh` stub,\
  \ an invalid wiring, `--project` from another directory, and a worktree of the home\
  \ repo.\n- S17: usage errors.\n- S19: `apply`'s `follow` is an absolute path to\
  \ the shim, quoted for a home path with a space.\n\nOne thing for the person to\
  \ know: the spec says `apply` gains `follow`, but `apply.py` isn't in T2's files.\
  \ I added `follow` in `cmd_apply` in `cli.py` instead, so no other file changed\
  \ and no question is needed.\n\nNo task of the list delivers a gap I found. S9 (a\
  \ log that can't be written) is T1's work, and S18 and S20 are T3 and T4."
