verdict:
  decision: reject
  reasons:
  - S6 is not fully met. A gated block (a unit with `step` None, such as the docs
    fixture's block gate) has its state events written with `attempt` None. So when
    a later gate attempt of the block escalates or waits again with the same reason,
    the new wait is never logged. The spec requires that a later attempt that waits
    again adds a new event, and that escalations are logged the same way.
  - Every other check passes. The diff touches only T1's files. `uv run pytest` passes
    (267 tests), and `ruff check` and `ruff format --check` are clean. S1-S5, S7,
    S8 (as far as `log` exists yet) and S9 are implemented and tested.
  findings:
  - check: Scenarios
    message: '`states()` writes `attempt` as `unit.attempt if unit.step else None`.
      A gated block has `step` None, yet `schedule.py` gives it a real attempt (`block.attempt
      = max(block.gates)`, lines 373-383). So the block''s escalation at gate attempt
      2 (`escalated reject`) compares equal to its attempt-1 event (`waiting`, `escalated
      reject`, None) and is not logged, which breaks S6''s "a later attempt that waits
      again adds a new one" for blocks. Log the block''s attempt too, for example
      when `unit.gates` or `unit.auto` is set.'
    location: plugins/fab0/lib/fab0_engine/events.py:178
  - check: Scenarios
    message: No test covers a state event for a gated block, which is why the attempt
      problem above went unseen. Add a test where a block's gate escalates on two
      successive attempts and expect two `waiting` events.
    location: tests/test_events.py:1
  - check: Tests and checks
    message: 'Minor: S7 is tested only against a unit waiting on `order`. The `data`,
      `claim` and `limit` cases are not tested to add no event. The code handles them
      correctly, because it requires a SIGNALS key.'
    location: tests/test_events.py:248
  - check: Tests and checks
    message: 'Minor: S9''s "same exit code" is tested only on commands that succeed.
      The path where `apply` stops with a Fail and puts the log warning into the Fail''s
      payload (`apply.py`, the try/except in `apply`) has no test.'
    location: plugins/fab0/lib/fab0_engine/apply.py:340
  - check: Quality that matters
    message: 'Minor: the run-level waiting event uses the run branch (`fab0/412/base`)
      as its `unit`. This matches how the inbox names it, but readers of the log (T2,
      T3) should know that `unit` is not always a unit id.'
    location: plugins/fab0/lib/fab0_engine/events.py:181
  details:
    unmet:
    - S6
