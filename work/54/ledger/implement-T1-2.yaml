summary: "Rework done. The gated-block attempt bug is fixed, and the two minor test\
  \ gaps and the doc note are covered. `uv run pytest` passes with 272 tests, and\
  \ `uv run ruff check` and `ruff format` are clean. I didn't rerun `claude plugin\
  \ validate`, because no plugin file changed.\n\nChanges, in /Users/zhen/Work/Fab0/fab0-core/.git/fab0/worktrees/54/implement-T1:\n\
  \n- **S6, gated blocks** (`plugins/fab0/lib/fab0_engine/events.py`): `EventLog.states`\
  \ now writes `attempt` for a unit that has a step, and also for a block with an\
  \ auto gate (`unit.auto is not None`). A block's escalation at gate attempt 2 is\
  \ therefore a new `waiting` event, not a repeat of attempt 1. A block with no auto\
  \ gate still logs no attempt.\n- **The `unit` field** (`events.py`): the module\
  \ docstring now says that `unit` is a unit id, except for the run's own pull-request\
  \ wait, which names the run branch, as the inbox does. Readers (T2, T3) should not\
  \ treat it as a unit. A comment sits at the code that writes it.\n- **New tests**\
  \ (`tests/test_events.py`):\n  - `test_a_gated_block_that_waits_is_logged_with_its_attempt`:\
  \ this is the docs fixture's block gate, escalating with `exit 1`. It expects one\
  \ `waiting` event for `parallel-3` with attempt 1 and reason `escalated reject`,\
  \ and none added by later `next` calls.\n  - `test_a_block_that_escalates_on_two_successive_attempts_adds_two_events`:\
  \ this runs `EventLog.states` on a fake run, because producing a real second gate\
  \ attempt of a block needs a child unit's rework. It expects two `waiting` events\
  \ (attempts 1 and 2), not one.\n  - `test_units_that_only_wait_their_turn_are_never_logged`:\
  \ units blocked by `order`, `data`, `claim` and `limit`, and waiting on `gate: merge`\
  \ and `gate: running`, add no event. A `tracker` block adds one `blocked` event.\
  \ This is the S7 gap.\n  - `test_apply_that_stops_with_a_failure_still_logs_and_warns`\
  \ and `test_apply_that_stops_with_a_failure_logs_what_it_did_first`: these cover\
  \ the path where `apply` stops with a Fail. An action is made to raise `Fail` on\
  \ its second call. With a writable log, the first entry is logged and the Fail carries\
  \ no warning. With an unwritable log, the Fail keeps its code and error, and its\
  \ payload gets one \"event couldn't be logged\" warning. This is the S9 gap.\n\n\
  Nothing else changed. `README.md` and `CLAUDE.md` already describe the log.\n\n\
  Commands run: `uv run pytest` (272 passed), `uv run ruff check` (clean), `uv run\
  \ ruff format` (no changes outside the two files above)."
