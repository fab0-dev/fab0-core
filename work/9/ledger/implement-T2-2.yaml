summary: 'Rework done. I added live checks for S6, S7 and S8 to scripts/check-agents.py, tightened one line of the implementer prompt, and ran `--only implementer` twice. All three cases passed both times; `uv run pytest -q` gives 73 passed. Only the two listed files changed.


  prompt change (plugins/fab0/agents/implementer.md): in ''What is a question'', the gap bullet now says to check every scenario of the spec, not only your own, against the scenarios all tasks trace to. Without it, the agent skipped the untraced scenario S3 in one of my runs. The ''Other tasks of this run'' section, S6, and the S8 bullet were already there from attempt 1. I left the overlap with the Scope bullet as it was, since the finding marked it non-blocking.


  checks (scripts/check-agents.py): the implementer step now runs three cases, each in its own fixture workspace.

  - `implementer` (baseline): a concrete S1 that T1 and T2 both trace to. The agent must return no questions. The baseline spec is now concrete, because the old one was too vague and the agent asked about the missing booking model.

  - `impl-gaps` (S6 and S7): the spec has S1, S2 and S3. T1 traces to S1, T2 traces to S2, and no task traces to S3. It passes only if no question is about S2 and at least one question names S3 and says no task delivers it.

  - `impl-outside` (S8): T1 lists only src/booking.py and tests/test_booking.py, but S1 needs a change to src/rooms.py. That file is seeded and committed on the task branch. It passes only if nothing outside the task''s files changed, ignoring work/ and __pycache__, and a question names rooms.py.


  I added helpers `run_implementer`, `questions_of` and `changed_paths`, and `task_workspace` now takes an optional spec and task list.


  runs: `uv run python scripts/check-agents.py --only implementer` passed all three cases twice, about $0.10 per case. An earlier run had impl-gaps failing. One cause was my S3 matcher being too narrow, which I fixed. The other was the S3 prompt gap above. The agent''s wording can vary between runs, so a rare flake in these live checks is possible. The other agents'' checks (spec-author, reviewer) were not run, and I did not change them.'
