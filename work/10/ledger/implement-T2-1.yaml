summary: "Edited the two skill files so /fab0:run applies the resolver's `review` and `draft` fields from T1 to task pull requests. No new tests: the repo only has resolver tests, and these two files are prose that the orchestrating session follows. `uv run pytest` in fab0-core passes, 80 tests, but it doesn't exercise the skill text.\n\nChanges in /Users/zhen/Work/Fab0/fab0-core/plugins/fab0/skills/github/SKILL.md, in the stage-branches section:\n- **Fields:** the `wait` result is documented as carrying `review` and `draft` for a stage with an agent gate only. A stage without one (spec stage, `gate: none`) skips all the new steps, so its pull requests and comments are unchanged.\n- **Open as a draft:** a new pull request is opened with `--draft` when `draft` is true. If GitHub refuses `--draft`, it is opened again without it, the body still carries the statement, and the refusal is reported (S1, S8).\n- **Body rewrite:** an existing pull request's body is rewritten on every update with\
  \ `gh pr edit --body-file`.\n- **Body layout:** `review.text`, copied verbatim, is the first line of the body. On `escalated` the gate's reasons come first, then `review.text`. After that come the stage summary and `Closes` or `Refs` (S1, S3, S4, S5, S6).\n- **Draft state:**\n  - On a pull request that already existed, the skill reads `isDraft` first and runs `gh pr ready` or `gh pr ready --undo` only when it differs from `draft`. That covers ready after approve (S3), back to draft (S6) and repeating a wait (S9).\n  - If turning it into a draft fails, the run does not stop. The statement stays on top of the body, questions and handoff comment are still posted, and the failure is reported (S8). This is an explicit exception to the \"stop on first failure\" rule.\n- **Questions:** posted on the pull request and the item assigned to the owner in the same session. The gate is not run on a questions attempt (S1).\n- **Handoff comment:** carries `review.text` verbatim (S2).\n- **Verbatim rule:**\
  \ a new \"The review statement\" subsection says never to reword `review.text` and never to decide the draft state oneself.\n\nChanges in /Users/zhen/Work/Fab0/fab0-core/plugins/fab0/skills/run/SKILL.md:\n- The `wait` handling for `human-gate`, `questions` and `escalated` gains the same rules, in short.\n- The final report now says whether each pull request is a draft or ready, what its statement says, and which pull requests couldn't be made a draft.\n\nThe resolver's `pr` object has no draft state, which T1 already noted. `/fab0:run` therefore reads `gh pr view --json isDraft` itself before changing the state.\n\nI found nothing in the spec that no task of the run delivers."
