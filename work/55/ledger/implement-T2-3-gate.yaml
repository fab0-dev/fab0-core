summary: 'One of the task''s own tests is flaky. tests/test_concurrency.py::test_the_required_checks_of_units_waiting_to_merge_are_read_with_their_pull_requests
  failed 2 times in 20 runs on its own, and once in 25 runs of the whole file. It
  fails with `AssertionError: the checks were asked for together, assert 2 == 3`.
  The assertion requires exactly 3 overlapping `checks` calls, but that number depends
  on how the threads are scheduled: the remaining unit pull-request reads compete
  for the same 4 slots. The attempt-2 summary says this test was made stable. It is
  not. The producer can fix it within tests/test_concurrency.py, or within schedule.py
  if the ordering is meant to be guaranteed.; Everything else holds up. On the branch
  worktree, `uv run pytest` gives 296 passed, `uv run ruff check .` is clean, and
  `uv run ruff format --check .` is clean. Apart from its ledger entries, the diff
  touches only the task''s 4 files. The gate-1 finding is resolved: the scout now
  settles a unit only after the units before it have settled as done, and tests cover
  the stale-spec case and the case of a unit that isn''t done. The S4 Given was settled
  on the PR as ''a run with independent units'', and the five-unit test shows 2 to
  4 calls in flight. The tracker''s 4-request limit is a BoundedSemaphore in Memo._call,
  held only around the backend call, so the nested gather pools can''t deadlock or
  go past 4.; S21, measured before the release: I ran `fab0-resolve status 44` from
  this branch through a logging `gh` wrapper. It made 4 tracker calls and took 3.3
  s, and its output is byte-identical to origin/fab0/55/base, which also made 4 calls.
  The formal measurement on the release is still to come, as the spec says.'
verdict:
  decision: reject
  reasons:
  - 'One of the task''s own tests is flaky. tests/test_concurrency.py::test_the_required_checks_of_units_waiting_to_merge_are_read_with_their_pull_requests
    failed 2 times in 20 runs on its own, and once in 25 runs of the whole file. It
    fails with `AssertionError: the checks were asked for together, assert 2 == 3`.
    The assertion requires exactly 3 overlapping `checks` calls, but that number depends
    on how the threads are scheduled: the remaining unit pull-request reads compete
    for the same 4 slots. The attempt-2 summary says this test was made stable. It
    is not. The producer can fix it within tests/test_concurrency.py, or within schedule.py
    if the ordering is meant to be guaranteed.'
  - 'Everything else holds up. On the branch worktree, `uv run pytest` gives 296 passed,
    `uv run ruff check .` is clean, and `uv run ruff format --check .` is clean. Apart
    from its ledger entries, the diff touches only the task''s 4 files. The gate-1
    finding is resolved: the scout now settles a unit only after the units before
    it have settled as done, and tests cover the stale-spec case and the case of a
    unit that isn''t done. The S4 Given was settled on the PR as ''a run with independent
    units'', and the five-unit test shows 2 to 4 calls in flight. The tracker''s 4-request
    limit is a BoundedSemaphore in Memo._call, held only around the backend call,
    so the nested gather pools can''t deadlock or go past 4.'
  - 'S21, measured before the release: I ran `fab0-resolve status 44` from this branch
    through a logging `gh` wrapper. It made 4 tracker calls and took 3.3 s, and its
    output is byte-identical to origin/fab0/55/base, which also made 4 calls. The
    formal measurement on the release is still to come, as the spec says.'
  findings:
