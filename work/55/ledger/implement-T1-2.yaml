summary: 'Rework done; only tracker.py and tests/test_tracker.py changed this round.
  `uv run pytest` passes (278 tests), and `uv run ruff check` and `ruff format` are
  clean. I did not run `gh` or `claude plugin validate`.


  1. Regression (board entries need the `project` scope): fixed.

  - `item_query(boards)` builds the GraphQL item query. Without a board it has no
  `projectItems` and no `Entry` fragment. GitHub rejects a query that defines a fragment
  it never spreads, so the fragment is added only with the board entries.

  - `GhCli.item` and `GhFake.item` take `boards=False`. Only a board field read (`Memo.fields`/`set_field`)
  makes the Memo ask for board entries, and `status`, `next` and `apply` without a
  board never do.

  - `Memo(backend, boards=False)` and `make_tracker(boards=False)` take a flag. With
  `boards=True` the run''s item comes with its sub-issues, relations and board entries
  in one request.

  - Without the flag, the first board field read makes one more `item` request with
  board entries. That request also covers the sub-issues, so there are no per-child
  requests. From then on, item reads in that command ask for board entries from the
  start. A project with a board therefore makes 2 `item` calls, unless `cli.py` passes
  `boards=True`.

  - `cli.py` belongs to T3, not T1. T3 should call `make_tracker(boards=...)` when
  the project has a board (`tracker.project` or a field is configured), so the run''s
  item with its board entries is one request, as the spec decision says. Until then
  the 2-call path works and is tested.

  - Tests added: `test_board_entries_are_asked_for_only_when_a_board_field_is_read`
  (fake, call arguments) and `test_the_adapter_asks_for_board_entries_only_when_a_board_is_read`
  (stubbed `gh`: the first query has no `projectItems`, the second has). A new check
  that every defined fragment is spread runs on both queries. S2 asserts `item` args
  `[repo, 412, False]` for `status`, `next` and `apply`, and the S9 test now expects
  `item(False)` then `item(True)`.


  2. Queries untested against GitHub: no change possible, because I must not run `gh`.
  I re-checked each field by hand (`blockedBy`, `subIssues`, `issueType`, `stateReason`,
  `repositoryOwner` with `... on Organization/User { projectV2 }`, `pullRequests(headRefName,
  baseRefName, states)`, `headRepository`), and found and fixed the unused-fragment
  error above. S21 on the release remains the real check, and the sub-issue, blocked-by
  and issue-type fields are the ones to look at.


  3. Bot logins: `PULLS_QUERY` now asks for `author { login __typename }`. `_login()`
  appends `[bot]` for a Bot author, so GraphQL reviews and comments match what REST
  gave (`github-actions[bot]`). The existing pull-request test now covers a bot comment.


  4. Writes and `MAX_IN_FLIGHT`: every `Memo` write (create_issue, add_sub_issue,
  add_blocked_by, edit_labels, assign, comment, close, add_to_board, set_field, create_pr,
  ready_pr) now goes through `_call`, so the 4-in-flight limit covers reads and writes
  together. New test `test_writes_count_toward_the_limit_of_requests_in_flight` starts
  12 comment writes and 6 reads on a 0.1 s fake, and in flight is at most 4 and at
  least 2.


  Files: /Users/zhen/Work/Fab0/fab0-core/.git/fab0/worktrees/55/implement-T1/plugins/fab0/lib/fab0_engine/tracker.py
  and /Users/zhen/Work/Fab0/fab0-core/.git/fab0/worktrees/55/implement-T1/tests/test_tracker.py.
  `apply.py` and `conftest.py` are as in attempt 1.


  No question. Every scenario of the task list has a task. The `make_tracker(boards=...)`
  call in `cli.py` is a pointer for T3, not a gap in T1.'
