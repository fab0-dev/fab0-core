summary: 'Rework done: the scout no longer reads for units the evaluation never reaches.
  `uv run pytest` passes (296 tests: 292 before plus 4 new), and `uv run ruff check
  .` and `uv run ruff format .` are clean. I did not run `gh`. S21 is still not measured
  on a release.


  What changed, only in `plugins/fab0/lib/fab0_engine/schedule.py` and `tests/test_concurrency.py`
  (`artifacts.py` and `actions.py` are as in attempt 1):

  - **Main fix.** The scout used to assume every earlier unit was done. Now `Scout.state`
  settles a copy of each unit on the pool (`Run.warm` settles it and returns whether
  it is done). It starts that only after the units that come before it have settled
  as done. If one of them is not done (stale spec, unit sent back for rework, unit
  waiting on its gate, a unit with no record yet), the unit is never settled and nothing
  is read for it.

  - **What counts as ''before''.** Units outside a foreach, and units of the same
  element, count as before. Units of other elements of the same foreach do not, unless
  the element''s `after` names them, so independent tasks still read at the same time.

  - **Order.** Waiting units are released through done-callbacks, in the order they
  were asked for. The first units get the four request slots first, as the walk does.
  A plain blocking wait raced and made the ''checks asked for together'' test flaky,
  so I did not use it. A pool shutdown leaves a waiting unit unstarted, and a failure
  in the scout is still left for the walk to meet.

  - **Extra git work.** `warm` now also settles units without a record (files only),
  because it needs their state. The extra git work you noted on `settle` (`conflicts`/merge-tree
  for units waiting to merge) is still there. It runs on the pool alongside the tracker
  waits and I left it.

  - **Your repro.** With five recorded units and the run item''s body edited, `evaluate()`
  now makes the same calls with and without the scout: 1 call, no `pulls`. `shutdown(wait=True)`
  no longer waits on extra reads.


  New tests in `tests/test_concurrency.py`:

  - the stale-spec case, comparing reads and results with the scout and with it off,
  and asserting no `pulls` are read;

  - the same case counting calls, which must be equal, and no thread left behind;

  - an earlier unit that is not done (on the S1 run, T1 is sent back) holds back the
  unit that is `after` it: no `pulls` for T2;

  - the S1 run read-for-read.

  With the guard removed, the first two fail with 5 extra `pulls`. The earlier S4,
  `next`/`apply`/`inbox` and checks-together tests pass over repeated runs.


  Questions are below. One S4 point I could not do as the review asked.'
questions:
- 'S4 says ''Given the run of S1'', and the review asked for it on `two_task_run`
  with one pipeline. That run cannot overlap two reads without a speculative read.
  On a `status` of the S1 run the tracker is read like this: the run''s item (the
  spec step''s `intent` input hash needs it), then T1''s pull request (T1 is stale,
  so T2 is never reached). T1''s pull request is used only if the spec stands, and
  that is known only once the item has been read. Reading it earlier is exactly the
  stale-spec waste the review rejected, and the spec''s decision says ''Prefetched
  reads are only those the evaluation then uses''. I kept the decision. S4 is shown
  on a run with independent units (five tasks, 2 to 4 in flight, 5 pull requests overlapping),
  and the S1 run is tested to make exactly the item read and T1''s pull request, one
  at a time. Which reading is meant? Either S4''s Given becomes ''a run with independent
  units'' (no change to the code), or prefetching may be speculative (a code change,
  and the decision must say so).'
