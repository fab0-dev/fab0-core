summary: 'The scout reads ahead for units the evaluation never settles, so a realistic
  run reads things it doesn''t use. That contradicts the spec''s decision that "Prefetched
  reads are only those the evaluation then uses". I reproduced it: take the five-unit
  run from tests/test_concurrency.py and change the run item''s body after the tasks
  are recorded, which makes the spec stale and leaves the tasks unreachable. The scout
  then reads all 5 unit pull requests. The sequential evaluation makes 1 call. The
  results are equal. The producer noted this risk but left it unresolved and untested,
  and it can be fixed within schedule.py.; Everything else holds up. `uv run pytest`
  passes (292 tests), and `uv run ruff check .` and `uv run ruff format --check .`
  are clean. The diff touches only the task''s 4 files plus its ledger entry. The
  pr.merge, pr.ready, pr.open-run, failing_checks and input_hashes rewrites give the
  same results in the same order as before. I ran `fab0-resolve status 44` from this
  branch through a logging gh wrapper: 4 tracker calls (4 in flight at once), 3.07
  s, and output identical to origin/fab0/55/base (4 calls, 3.48 s). S21 looks met
  before the release, but the formal measurement on the release is still to come.'
verdict:
  decision: reject
  reasons:
  - 'The scout reads ahead for units the evaluation never settles, so a realistic
    run reads things it doesn''t use. That contradicts the spec''s decision that "Prefetched
    reads are only those the evaluation then uses". I reproduced it: take the five-unit
    run from tests/test_concurrency.py and change the run item''s body after the tasks
    are recorded, which makes the spec stale and leaves the tasks unreachable. The
    scout then reads all 5 unit pull requests. The sequential evaluation makes 1 call.
    The results are equal. The producer noted this risk but left it unresolved and
    untested, and it can be fixed within schedule.py.'
  - 'Everything else holds up. `uv run pytest` passes (292 tests), and `uv run ruff
    check .` and `uv run ruff format --check .` are clean. The diff touches only the
    task''s 4 files plus its ledger entry. The pr.merge, pr.ready, pr.open-run, failing_checks
    and input_hashes rewrites give the same results in the same order as before. I
    ran `fab0-resolve status 44` from this branch through a logging gh wrapper: 4
    tracker calls (4 in flight at once), 3.07 s, and output identical to origin/fab0/55/base
    (4 calls, 3.48 s). S21 looks met before the release, but the formal measurement
    on the release is still to come.'
  findings:
  - check: Agreement with the spec
    message: 'Scout.action_state and Scout.state assume every unit before the current
      one is done, so warm() reads pull requests and checks for recorded units the
      real walk leaves unreachable and never settles. This breaks the decision ''Prefetched
      reads are only those the evaluation then uses'': with five recorded tasks and
      the issue body edited so the spec goes stale, `evaluate()` makes 6 tracker calls
      with the scout and 1 without (the 5 extra are `pulls` for implement-T1..T5),
      and `shutdown(wait=True)` also waits for those extra reads.'
    location: plugins/fab0/lib/fab0_engine/schedule.py:1208
  - check: Tests
    message: No S5 test covers a run where an earlier unit stops being done after
      later units are recorded (spec stale, or a unit's rework). That is exactly where
      the claim that the scout reads only what the walk reads breaks, so the equality
      test needs that case.
    location: tests/test_concurrency.py:124
  - check: Scenarios
    message: S4 says 'Given the run of S1', but the S4 test uses a five-unit run instead,
      and the summary says S1's run can't overlap reads. That holds only with two
      pipelines. On the default S1 run (two_task_run, one pipeline) with a 0.3 s fake,
      `status` overlaps the item read and T1's pull-request read (2 in flight), so
      S4 can be shown on its own fixture and should be.
    location: tests/test_concurrency.py:65
  - check: Quality
    message: 'Minor: warm() runs the real settle() on a copy of the unit, which repeats
      git work (ledger reads and `conflicts`/merge-tree for units waiting to merge)
      that the walk does again. It is not a correctness problem, but it adds git subprocesses
      on every evaluation.'
    location: plugins/fab0/lib/fab0_engine/schedule.py:264
