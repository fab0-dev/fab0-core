summary: 'Fixed the flaky test. The only change this attempt is in tests/test_concurrency.py:
  test_the_required_checks_of_units_waiting_to_merge_are_read_with_their_pull_requests
  no longer asserts exactly 3 overlapping `checks` calls. That number depended on
  thread scheduling, because the fifth unit''s pull-request read competes with the
  checks for the 4 slots. It now asserts 2 <= in_flight(checks) <= 3, with a comment
  saying why. The code does guarantee that: the three checks are issued together after
  their pull requests are known, so at least two overlap, and there are only three
  of them. The test still asserts that exactly 3 `checks` calls are made and that
  no read is repeated. It also still asserts that the result and the reads equal those
  of the evaluation without the scout. I made no change to schedule.py.


  Checks, run on the branch worktree:

  - The test alone, 25 runs in a row: all 25 passed (the earlier code failed 2 in
  20).

  - `uv run pytest`: 296 passed.

  - `uv run ruff check .`: clean.

  - `uv run ruff format --check .`: clean.

  - I did not run `gh`.


  The two minor points from the review stay as they are:

  - Spec wording, for the spec''s owner: specs/55.md S4''s Given reads ''the run of
  S1'', but as settled on the PR the test uses a run with independent units (five
  tasks). I did not edit the spec.

  - Run.warm (schedule.py:264) still runs settle() on a copy of each reachable unit,
  which repeats git work on each evaluation. It is a quality note, not a correctness
  issue, and I left it out of this fix.


  S21 (run 44, measured on the release) is still to come, as the spec says.'
