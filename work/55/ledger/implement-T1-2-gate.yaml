summary: 'Within its own files, T1 meets every scenario it was given (S1, S2, S3,
  S6, S7, S8, S9, S10, S11). Each has a test in tests/test_tracker.py. In the worktree,
  `uv run pytest` passes 278 tests, and `uv run ruff check` and `ruff format --check`
  are clean. Only the four task files changed. The four findings from gate 1 are dealt
  with: board entries are asked for only when a board field is read, every query uses
  each fragment it defines, bot logins get the `[bot]` suffix, and writes count toward
  MAX_IN_FLIGHT.; A person has to decide who wires the board flag. The spec decision
  says the run''s item is read in one GraphQL query, board fields and board entry
  included. On a project with a board, T1 still makes two `item` requests for the
  run''s item in every round of `apply` that sets signals, and in any `status` or
  `next` that checks a board field: first item(False), then item(True). The fix is
  to call `make_tracker(boards=True)` in cli.py when `tracker.project` or a field
  is configured. T1 can''t do that: cli.py is not one of its files, and nothing in
  tracker.py or apply.py knows the project''s config. T3 owns cli.py, but its task
  does not mention this wiring, so it can easily be lost. Decide whether T3 (or another
  task) takes on passing `boards=` from cli.py, with a test that a project with a
  board reads the run''s item in one call. If so, approve T1 as it is.'
