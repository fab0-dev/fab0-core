      path is not tested through apply.'
    location: tests/test_tracker.py:288
  - check: quality
    message: 'Minor: GhFake''s reads (for example open_items, which iterates the issues
      dict) don''t take its lock while its writes change self.data under it, so a
      concurrent read and write could raise; the engine doesn''t overlap them today,
      but the decision says the fake is safe to call from several threads.'
    location: plugins/fab0/lib/fab0_engine/tracker.py:484
  - check: quality
    message: 'Minor: the GraphQL queries (blockedBy, subIssues, issueType, projectItems,
