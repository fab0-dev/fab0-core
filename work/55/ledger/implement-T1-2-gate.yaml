  findings:
  - check: agreement with the spec
    message: On a project with a board, the run's item is fetched twice per evaluation
      (item(False), then item(True) on the first board field read), against the decision
      that it is one query with its board entries; the test fixes this two-call behaviour
      as expected, and the fix needs cli.py, which T1 doesn't own.
    location: tests/test_tracker.py:269
  - check: scope
    message: make_tracker(boards=...) is never called with True by any caller, so
      the one-request path for board projects is used only in unit tests until a later
      task wires it in cli.py.
    location: plugins/fab0/lib/fab0_engine/tracker.py:879
  - check: tests
    message: 'Minor: the S10 test says nothing is written ''even to add an item to
