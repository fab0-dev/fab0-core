  `next` and `apply`.
verdict:
  decision: reject
  reasons:
  - The T1 scenarios S1, S2, S3, S6, S7, S8, S9, S10 and S11 each have a test in tests/test_tracker.py.
    In the worktree, `uv run pytest` passed 275 tests, and `uv run ruff check` and
    `ruff format --check` are clean. Only the four files of the task changed.
  - The change has to go back because of one regression. Every command now asks GitHub
    for the run's item with its board entries (`projectItems`). That field needs the
    `project` scope even when the factory has no board. Before, it was read only when
    a board field was configured, and docs/how-to/github-setup.md says a board is
    optional and that only a board needs the `project` scope. A factory without a
    board, whose `gh` login has the default scopes, may now fail on every `status`,
    `next` and `apply`.
  findings:
  - check: quality
    message: ITEM_QUERY always asks for `projectItems` on the item and on each sub-issue.
      GitHub refuses that field without the `project` scope, and `_graphql` raises
      when a reply has errors and no data, so a factory with no board and a login
      with the default scopes (repo, read:org, gist) would fail every command. Before
      this change it worked, because board fields were read only when `tracker.project`
      or a field was configured. Ask for the board entries only when the project has
      a board, for example with a flag passed to `make_tracker`, or show that GitHub
      answers the rest of the query without them.
    location: plugins/fab0/lib/fab0_engine/tracker.py:95
  - check: quality
    message: No test runs the new GraphQL queries (item, pull requests, board) against
      GitHub. They are tested only against canned JSON written from the producer's
      reading of the schema. That is right for unit tests, but whether `blockedBy`,
      `subIssues`, `issueType` and the fragment on `repositoryOwner` really work remains
      unproven until S21 is measured.
    location: plugins/fab0/lib/fab0_engine/tracker.py:88
  - check: quality
    message: 'Minor: reviews and comments now come from GraphQL, which gives a bot
      as `author.login` without the `[bot]` suffix that REST used (`github-actions`,
      not `github-actions[bot]`). Any comparison of a review''s or comment''s user
      with a configured login could change for bot authors.'
    location: plugins/fab0/lib/fab0_engine/tracker.py:291
  - check: quality
    message: 'Minor: writes go straight to the backend without passing `_slots`, so
      MAX_IN_FLIGHT bounds only reads. It holds today because `apply` writes one at
      a time, but once T2 adds concurrency the limit of 4 calls in flight is not enforced
      for writes.'
    location: plugins/fab0/lib/fab0_engine/tracker.py:783
