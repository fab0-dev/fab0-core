summary: The T1 scenarios S1, S2, S3, S6, S7, S8, S9, S10 and S11 each have a test
  in tests/test_tracker.py. In the worktree, `uv run pytest` passed 275 tests, and
  `uv run ruff check` and `ruff format --check` are clean. Only the four files of
  the task changed.; The change has to go back because of one regression. Every command
  now asks GitHub for the run's item with its board entries (`projectItems`). That
  field needs the `project` scope even when the factory has no board. Before, it was
  read only when a board field was configured, and docs/how-to/github-setup.md says
