summary: "Done, with two questions below. `next --apply` is built, `record` reads\
  \ no tracker on the usual path, and `/fab0:run` uses both. Full suite passes (`uv\
  \ run pytest -q`: 293 passed, 15 of them new in `tests/test_round.py`), and `uv\
  \ run ruff check` and `ruff format` are clean. I ran no `gh` and no real run, so\
  \ S22 (measured on the release) is not shown.\n\nWhat changed:\n- `apply.py`: new\
  \ `settle(run, only)` returns the `Run` as its last round evaluated it, plus the\
  \ `apply` result. `apply()` now just returns `settle(...)[1]`, so `apply` behaves\
  \ as before.\n- `cli.py`, `next --apply`:\n  - It calls `settle` for every unit,\
  \ then hands out from that last evaluation. That is one tracker pass.\n  - `--unit`\
  \ limits only the hand-outs.\n  - Its result is `apply`'s `applied` plus `units`\
  \ and `handouts`.\n  - It hands out nothing when `kind` is `done` or `waiting`.\n\
  \  - If `apply` fails, the failure propagates and nothing is claimed or saved.\n\
  \  - A `--unit` that isn't ready exits 4 and the error still carries `applied`.\n\
  \  - The hand-out loop moved into `hand_out()`; `next` without `--apply` behaves\
  \ as before.\n- `cli.py`, `record`:\n  - It picks the pipeline with the real tracker,\
  \ so with several pipelines its only call reads the run's item.\n  - It no longer\
  \ asks who is running.\n  - It then evaluates the run with `OfflineRun` against\
  \ `NoTracker`, which answers every read with nothing and has no writes.\n  - Plain\
  \ \"everything is empty\" dropped later units out of the run (see Q1), so `OfflineRun`\
  \ makes two changes. A block's onStart actions count as done, and stale-input checks\
  \ ignore issue, pr and tool inputs.\n  - If the unit is still not in the offline\
  \ run, `record` redoes the evaluation against the real tracker. This is the case\
  \ for a unit behind a `when` on a tracker condition, such as `page` in the triage\
  \ fixture. In that case `record` does read the tracker, with the same result as\
  \ before.\n- `SKILL.md`: the loop is four steps. (1) `fab0-resolve next <run> --apply`,\
  \ with `applied` shown, start lines shown, and `--unit` documented as limiting hand-outs\
  \ only. (2) Checkouts. (3) Execute. (4) Record and commit, one Bash call per hand-out:\
  \ `record && git add && git commit || echo \"failed: exit $?\"`, all of the round's\
  \ calls in one message. The `|| echo` keeps one refusal from cancelling its sibling\
  \ calls. A refused return makes the session call its agent once more with the errors.\n\
  \nTests in `tests/test_round.py`:\n- S12: `next --apply` gives `apply`'s `applied`\
  \ and the `units` and `handouts` that `next` gives after `apply`, compared on two\
  \ identical factories.\n- S13: a quiet round makes exactly one more read than `status`,\
  \ and it is `user`. A second test covers a run with a signal field (see Q2).\n-\
  \ S14: `apply` fails inside `next --apply` (a board lacking the field). Same code\
  \ and error as `apply`, no hand-out, nothing claimed.\n- S15: `--unit` applies T2's\
  \ due merge and hands out only T1. A not-ready unit is refused with exit 4, the\
  \ result lists `applied`, and the merge happened.\n- S16: `waiting` and `done` runs\
  \ hand out nothing.\n- S17: no tracker call for a spec unit, a failed check, a foreach\
  \ unit and a gate record.\n- S18: with two pipelines, `record`'s only call is the\
  \ item read.\n- S19: a structural check of `SKILL.md`: four steps, no separate `apply`\
  \ or `next`, chained `&&`, one message.\n- S20: three records run concurrently in\
  \ shell with the skill's exact chain. A bad return commits nothing and writes no\
  \ entry. The other two are committed, and the retry works.\n\nQuestions:\n1. S17\
  \ (decision on `record`): the spec says to evaluate the run \"against a tracker\
  \ that answers every read with nothing\". That alone breaks `record`. Tracker-sourced\
  \ inputs hash to nothing, so the spec unit turns stale and the foreach's units vanish.\
  \ A foreach onStart can't be checked, so units after it vanish. Units behind a `when`\
  \ on a tracker condition vanish too. I worked around it in `cli.py` as described\
  \ above. The root fix is for `handout.record` (`handout.py`) to take the unit and\
  \ its context from the saved hand-out instead of the evaluation, or for `schedule.py`\
  \ to tolerate a missing tracker. Neither file is in T3. Is the workaround acceptable,\
  \ or should a task change one of those files?\n2. S13 with a signal field: `tests/test_tracker.py`\
  \ (T1's file) locks in that `cli.py` calls `make_tracker()` without `boards=True`.\
  \ Passing it when the project has a board would break two of T1's tests (the story\
  \ fixture has `project: 7`, and `signal_run` expects two item reads). So the first\
  \ read of a board field in `apply` or `next --apply` makes a second item read, and\
  \ a quiet round with a signal field makes two more reads than `status`: `user` and\
  \ that item read. My test documents this. Without a signal field the round is exactly\
  \ one more. To meet S13 with signals, `cli.py` should pass `make_tracker(boards=True)`\
  \ when the project has `tracker.project` or `tracker.fields`. That needs T1's two\
  \ tests in `tests/test_tracker.py` updated. Which task owns that change?\n\nAlso:\
  \ S21 and S22 are measured on the release, and the T2 concurrency work isn't part\
  \ of this task. The session's four turns (S19) can only be checked structurally,\
  \ so the real saving shows when a real run goes through `/fab0:run`.\n\nFiles changed:\
  \ `/Users/zhen/Work/Fab0/fab0-core/.git/fab0/worktrees/55/implement-T3/plugins/fab0/lib/fab0_engine/cli.py`,\
  \ `.../apply.py`, `.../plugins/fab0/skills/run/SKILL.md`, and the new `.../tests/test_round.py`.\
  \ The `.venv` that `uv run` created inside the worktree is untracked and not part\
  \ of the change."
