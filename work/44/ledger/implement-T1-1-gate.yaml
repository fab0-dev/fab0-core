summary: 'The spec''s constraint ''Tests never read the real ~/.claude: they point
  CLAUDE_CONFIG_DIR at a temporary directory'' cannot be met inside T1''s files. load_wiring
  now calls check_engine for every project command, and the existing tests (for example
  tests/test_cli.py and the other modules that run validate, status, next, record,
  apply or inbox) don''t set CLAUDE_CONFIG_DIR. So they read <home>/.claude/plugins/installed_plugins.json
  on whatever machine runs them. The producer reported this too. The right fix is
  an autouse fixture in tests/conftest.py (or pytest env config in pyproject.toml),
  and neither file is in the task''s list. A person has to decide whether to widen
  T1''s files to include tests/conftest.py, or accept the gap and track it as a follow-up.;
  Apart from that gap, the change does what the task asks. S1 to S11 are implemented
  and S3 to S11 have tests. S1 and S2 are covered by the SKILL.md wording plus the
  S3 refusal test. The diff touches only the five listed files. 209 tests pass, and
  ruff check and ruff format --check are clean in the worktree.; Today the suite still
  passes on this machine only by luck: the real install record has only project-scope
  fab0@fab0 entries at 0.6.3, and no user-scope one. A user-scope record newer than
  the checkout''s manifest (for example after the next release) would make every other
  test that runs a project command fail with the refusal.'
