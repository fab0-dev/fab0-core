summary: 'Fixed the rework findings. A done gated block now shows its duration. In
  `schedule.py`, when a block with an auto gate is `done` (its units are on the parent
  branch), the walk now calls `load_latest(block)`, so its recorded gate decisions
  are read. Before this, only a waiting block loaded them, so a finished block''s
  summary had no duration. `status`, `next` and the end report now show `duration`
  and `took` for a recorded block after the run too. Blocks whose gate is `none` or
  `human` write no gate entry, so they stay without a duration, as units never recorded
  do. Tests added in `tests/test_durations.py`: (1) a gated block with an approved
  command gate (1m 5s) shows 65 seconds and `1m 5s` while it waits; (2) the same block
  after its merge into the run branch, state `done`, still shows 65 and `1m 5s`. I
  checked that test (2) fails without the fix (KeyError on `duration`). Both retime
  the gate entry in the block''s checkout and amend the commit, so the times are in
  the merged ledger; the clock isn''t faked. I also added a check that an old-style
  entry without times still parses against the ledger schema (`ledger.parse`). `retime`
  now takes a `run` argument. Commands run: `uv run pytest -q` gave 248 passed; `uv
  run ruff check .` was clean; `uv run ruff format --check .` was clean. Only `plugins/fab0/lib/fab0_engine/schedule.py`
  and `tests/test_durations.py` changed.'
