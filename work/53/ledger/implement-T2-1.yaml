summary: 'Every unit summary from `status` and `next` now carries `duration` (whole
  seconds) and `took`: the sum over all recorded attempts and gate decisions, from
  the ledger''s `started` and `ended`. The full suite passes (246 tests, including
  the new ones), and `ruff check` and `ruff format --check` are clean.


  Both fields are left out when nothing is recorded, or when any attempt or gate entry
  lacks times (S10). I added a `Unit.duration()` method in `schedule.py` that does
  the sum, and `Unit.summary()` adds the two fields. It reuses T1''s `seconds_between`
  and `took` from `ledger.py`, so there is no second formatter and no existing field
  was renamed.


  Tests are in `tests/test_durations.py` (S10, S12). They don''t fake the clock; they
  set the times by rewriting the ledger entry files in the unit''s checkout.

  - **S12:** attempt 1 (4m 12s), a rejecting gate (1m 5s) and attempt 2 (3m 0s) give
  497 seconds and `8m 17s`, from both `status` and `next`.

  - **Unit never recorded:** it shows no duration.

  - **Single attempt:** one attempt alone counts (42s).

  - **S10, attempt:** one attempt entry without times leaves the duration out and
  nothing fails.

  - **S10, gate:** a gate entry without times does the same.

  - **Direct `Unit.duration()` test:** an end before its start counts as 0.


  One limit: a gated block whose gate is already approved and merged has its ledger
  entries loaded only while the block is waiting. Once the block is done, its summary
  shows no duration. Nothing in the scenarios requires one for blocks, so I left it.


  I ran `uv run pytest -q`, `uv run ruff check .` and `uv run ruff format --check
  .`. Only `plugins/fab0/lib/fab0_engine/schedule.py` and `tests/test_durations.py`
  changed.'
