summary: The fix for the gate-1 finding works for a gated block that is done. But
  a gated block whose gate has already decided still shows no duration whenever it
  is `open` (one of its units is reworking, the case the code comment 'a unit that
  moves on asks for a new decision' allows for) or unreachable. That is because `load_latest(block)`
  still runs only on the done and waiting paths. The spec's decision says `status`
  gives each unit the sum over all its recorded attempts and gate decisions, and leaves
  the fields out only when an entry lacks times or nothing is recorded. A block with
  a recorded gate decision is recorded, so it must not lose its duration mid-run and
  then get it back once it is done. This can be fixed within the task's files, for
  example by loading an auto-gated block's entries before the `not children_done`
  and `not reachable` returns.; Everything else checks out. `Unit.duration()` sums
  the history and gate entries with T1's `seconds_between` and `took`, so there is
  one formatter, and a clock that moved back counts as 0. Both fields are left out
  when nothing is recorded or any entry lacks times (S10), and an old entry without
  times still parses. The S12 sum (497 s, `8m 17s`) is tested through both `status`
  and `next`. No field was renamed or removed. The diff touches only plugins/fab0/lib/fab0_engine/schedule.py
  and tests/test_durations.py. In /Users/zhen/Work/Fab0/fab0-core/.git/fab0/worktrees/53/implement-T2,
  `uv run pytest -q` gives 248 passed, and `uv run ruff check .` and `uv run ruff
  format --check .` are clean.
verdict:
  decision: reject
  reasons:
  - The fix for the gate-1 finding works for a gated block that is done. But a gated
    block whose gate has already decided still shows no duration whenever it is `open`
    (one of its units is reworking, the case the code comment 'a unit that moves on
    asks for a new decision' allows for) or unreachable. That is because `load_latest(block)`
    still runs only on the done and waiting paths. The spec's decision says `status`
    gives each unit the sum over all its recorded attempts and gate decisions, and
    leaves the fields out only when an entry lacks times or nothing is recorded. A
    block with a recorded gate decision is recorded, so it must not lose its duration
    mid-run and then get it back once it is done. This can be fixed within the task's
    files, for example by loading an auto-gated block's entries before the `not children_done`
    and `not reachable` returns.
  - Everything else checks out. `Unit.duration()` sums the history and gate entries
    with T1's `seconds_between` and `took`, so there is one formatter, and a clock
    that moved back counts as 0. Both fields are left out when nothing is recorded
    or any entry lacks times (S10), and an old entry without times still parses. The
    S12 sum (497 s, `8m 17s`) is tested through both `status` and `next`. No field
    was renamed or removed. The diff touches only plugins/fab0/lib/fab0_engine/schedule.py
    and tests/test_durations.py. In /Users/zhen/Work/Fab0/fab0-core/.git/fab0/worktrees/53/implement-T2,
    `uv run pytest -q` gives 248 passed, and `uv run ruff check .` and `uv run ruff
    format --check .` are clean.
  findings:
  - check: Agreement with the spec
    message: An auto-gated block whose units are not all done returns 'open' before
      `load_latest(block)` runs, so its recorded gate decisions are never read and
      `status` and `next` show no duration for a block that was recorded. The decision
      says the sum covers all recorded gate decisions and is left out only when nothing
      is recorded or an entry lacks times.
    location: plugins/fab0/lib/fab0_engine/schedule.py:359
  - check: Agreement with the spec
    message: The unreachable path of an auto-gated block also returns without loading
      its gate entries, so a block that was decided before shows no duration while
      it is unreachable.
    location: plugins/fab0/lib/fab0_engine/schedule.py:352
  - check: Scenarios
    message: No test covers a gated block that has a recorded gate decision while
      one of its units moves on to a new attempt (block state 'open'), so the gap
      above goes unnoticed.
    location: tests/test_durations.py:115
  details:
    unmet:
    - S12
