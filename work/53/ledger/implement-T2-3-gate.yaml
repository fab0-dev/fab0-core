summary: 'S10 is met. `Unit.duration()` in plugins/fab0/lib/fab0_engine/schedule.py
  leaves out `duration` and `took` when nothing is recorded, or when any recorded
  attempt or gate decision has no `started` and `ended`. An old entry without times
  still parses. Tests: test_an_entry_without_times_leaves_the_duration_out, test_a_gate_decision_without_times_leaves_the_duration_out,
  test_a_unit_never_recorded_shows_no_duration.; S12 is met on the engine side. The
  sum of 4m 12s, 1m 5s and 3m 0s gives 497 seconds and `8m 17s`, through both `status`
  and `next` (test_a_unit_has_the_sum_of_its_attempts_and_gate_decisions). Showing
  the durations in the end report is T3''s part.; The gate-2 finding is fixed. `walk_node`
  now calls `load_latest(block)` once for every auto-gated block, before the `not
  reachable` and `not children_done` returns. So a gated block with a recorded decision
  keeps its duration whether it is open, unreachable, waiting or done. The waiting
  path no longer loads the entries a second time. Tests cover the waiting, done and
  open cases.; The change agrees with the spec. There is one formatter: T1''s `took`
  and `seconds_between` in ledger.py are reused, and a clock that moved back counts
  as 0. Fields are only added, and no new dependency is used.; Scope: `git diff --name-only
  origin/fab0/53/base...fab0/53/implement-T2` (with the run''s ledger excluded) lists
  only plugins/fab0/lib/fab0_engine/schedule.py and tests/test_durations.py.; Checks,
  run in /Users/zhen/Work/Fab0/fab0-core/.git/fab0/worktrees/53/implement-T2: `uv
  run pytest -q` gave 249 passed, and `uv run ruff check .` and `uv run ruff format
  --check .` were clean. The working tree is clean and `git stash list` is empty.'
verdict:
  decision: approve
  reasons:
  - 'S10 is met. `Unit.duration()` in plugins/fab0/lib/fab0_engine/schedule.py leaves
    out `duration` and `took` when nothing is recorded, or when any recorded attempt
    or gate decision has no `started` and `ended`. An old entry without times still
    parses. Tests: test_an_entry_without_times_leaves_the_duration_out, test_a_gate_decision_without_times_leaves_the_duration_out,
    test_a_unit_never_recorded_shows_no_duration.'
  - S12 is met on the engine side. The sum of 4m 12s, 1m 5s and 3m 0s gives 497 seconds
    and `8m 17s`, through both `status` and `next` (test_a_unit_has_the_sum_of_its_attempts_and_gate_decisions).
    Showing the durations in the end report is T3's part.
  - The gate-2 finding is fixed. `walk_node` now calls `load_latest(block)` once for
    every auto-gated block, before the `not reachable` and `not children_done` returns.
    So a gated block with a recorded decision keeps its duration whether it is open,
    unreachable, waiting or done. The waiting path no longer loads the entries a second
    time. Tests cover the waiting, done and open cases.
  - 'The change agrees with the spec. There is one formatter: T1''s `took` and `seconds_between`
    in ledger.py are reused, and a clock that moved back counts as 0. Fields are only
    added, and no new dependency is used.'
  - 'Scope: `git diff --name-only origin/fab0/53/base...fab0/53/implement-T2` (with
    the run''s ledger excluded) lists only plugins/fab0/lib/fab0_engine/schedule.py
    and tests/test_durations.py.'
  - 'Checks, run in /Users/zhen/Work/Fab0/fab0-core/.git/fab0/worktrees/53/implement-T2:
    `uv run pytest -q` gave 249 passed, and `uv run ruff check .` and `uv run ruff
    format --check .` were clean. The working tree is clean and `git stash list` is
    empty.'
  findings:
