summary: S12 and the spec's decision say that status gives each unit the sum over
  all its recorded attempts and gate decisions, and that the end report shows every
  unit with a duration. Only units never recorded should show none. A gated block
  keeps its gate decisions in the ledger, and gates.py stamps them with started/ended.
  But schedule.py loads those entries only while the block is waiting. Once the block
  is done its summary has no duration, so at the end of a run, which is exactly when
  the end report is read, a recorded block shows none. The producer's summary admits
  this gap and leaves it in place. It can be fixed within the task's files.; Everything
  else checks out. Unit.duration() sums history and gate entries and reuses T1's seconds_between
  and took, so there is no second formatter. Both fields are left out when nothing
  is recorded or any entry lacks times (S10), and no field was renamed. The diff touches
  only plugins/fab0/lib/fab0_engine/schedule.py and tests/test_durations.py. In the
  worktree, uv run pytest -q gives 246 passed, and uv run ruff check . and uv run
  ruff format --check . are clean.
verdict:
  decision: reject
  reasons:
  - S12 and the spec's decision say that status gives each unit the sum over all its
    recorded attempts and gate decisions, and that the end report shows every unit
    with a duration. Only units never recorded should show none. A gated block keeps
    its gate decisions in the ledger, and gates.py stamps them with started/ended.
    But schedule.py loads those entries only while the block is waiting. Once the
    block is done its summary has no duration, so at the end of a run, which is exactly
    when the end report is read, a recorded block shows none. The producer's summary
    admits this gap and leaves it in place. It can be fixed within the task's files.
  - Everything else checks out. Unit.duration() sums history and gate entries and
    reuses T1's seconds_between and took, so there is no second formatter. Both fields
    are left out when nothing is recorded or any entry lacks times (S10), and no field
    was renamed. The diff touches only plugins/fab0/lib/fab0_engine/schedule.py and
    tests/test_durations.py. In the worktree, uv run pytest -q gives 246 passed, and
    uv run ruff check . and uv run ruff format --check . are clean.
  findings:
  - check: Scenarios
    message: A gated block that is done never has load_latest(block) called, because
      walk_block returns 'done' before line 372. Its recorded gate decisions are never
      read, so status and the end report show no duration for a unit that was recorded,
      against S12 ('Units never recorded show none') and the decision that duration
      is the sum over all recorded attempts and gate decisions.
    location: plugins/fab0/lib/fab0_engine/schedule.py:362
  - check: Scenarios
    message: The tests cover only a step unit. No test covers a gated block's duration,
      neither while it waits nor after it is done, so the gap above goes unnoticed.
    location: tests/test_durations.py:1
  - check: Quality
    message: 'Minor: test_an_entry_without_times_leaves_the_duration_out checks ''nothing
      fails'' only by asserting unit[''state''] is truthy. It would be clearer to
      also assert that the old-style entry still passes the ledger schema, though
      story.run succeeding already shows parse accepted it.'
    location: tests/test_durations.py:67
  details:
    unmet:
    - S12
